name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `--locked` everywhere: this repository ships binaries, so the committed
  # Cargo.lock is part of what is being tested.
  RUSTFLAGS: ""

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev fonts-dejavu-core
      - run: cargo fmt --check --all
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: cargo test --locked
      - name: CLI capabilities probe (smoke)
        run: |
          ./target/release/hypreq --help
          ./target/release/hypreq --list-models

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: cargo test --locked
      - name: CLI capabilities probe (smoke)
        run: |
          .\target\release\hypreq.exe --help
          .\target\release\hypreq.exe --list-models

  # The GNU target is what a Windows user without Visual Studio builds, and what
  # scripts/release.sh cross-builds for the release zip — so prove it from Linux,
  # where the mingw toolchain is a package and not a shell-PATH lottery.
  windows-gnu:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 binutils-mingw-w64-x86-64
      - run: cargo build --locked --release --target x86_64-pc-windows-gnu
      # Symbol-aware FMA contraction guard (matching scripts/release.sh):
      - name: No FMA contraction in Windows binary
        run: |
          python3 - "target/x86_64-pc-windows-gnu/release/hypreq.exe" <<'PY'
          import re, subprocess, sys
          f = sys.argv[1]
          proc = subprocess.Popen(["x86_64-w64-mingw32-objdump", "-d", f], stdout=subprocess.PIPE, text=True)
          ins = fma = non_fft_fma = 0
          curr = ""
          fma_re = re.compile(r"\b(vfmadd|vfmsub|vfnmadd|vfnmsub|vfmaddsub|vfmsubadd)")
          for line in proc.stdout:
              if line.endswith(":\n") and not line.startswith(" "):
                  curr = line.strip()[:-1]
              elif line.startswith(" "):
                  ins += 1
                  if fma_re.search(line):
                      fma += 1
                      if "rustfft" not in curr:
                          non_fft_fma += 1
          proc.wait()
          print(f"{f}: ins={ins} total_fma={fma} (non_rustfft={non_fft_fma})")
          assert proc.returncode == 0 and ins > 1000, f"cannot disassemble {f}"
          assert non_fft_fma == 0, f"FMA contraction outside rustfft in {f} ({non_fft_fma})"
          assert fma <= 1400, f"unexpected extra FMA instructions ({fma})"
          PY

  # The proof package's own gate: build with the pinned Lean toolchain, then audit
  # every theorem's axioms. See docs/LEAN_VERIFICATION.md.
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build proofs and enforce the axiom gate
        run: scripts/lean-verify.sh

  # `rust-version` in Cargo.toml is a declared contract, so prove it on that exact
  # toolchain instead of trusting the moving `stable` tag in the jobs above.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev fonts-dejavu-core
      - run: cargo build --locked
      - run: cargo test --locked
