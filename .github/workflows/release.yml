name: release

# Tag-driven, because the artefacts are only meaningful once the tree they came from
# is fixed: the Linux tarball and the Windows zip are built from one commit by
# scripts/release.sh, which also runs the FMA guard before anything is uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        # mingw-w64 cross-builds the Windows binaries here (one job, one resolve, so
        # the Linux and Windows artefacts provably come from the same Cargo.lock)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev fonts-dejavu-core \
            mingw-w64 binutils-mingw-w64-x86-64 zip jq
      - name: Build, verify, guard
        run: ./scripts/release.sh
      - name: What shipped
        run: |
          cd dist
          sha256sum -c sha256sums.txt
          { echo '```'; cat sha256sums.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hypreq-artifacts
          path: dist/*
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF_NAME}
          notes="HyprEQ $tag — Rig-compensated minimum-phase FIR convolver generator + true-peak ceiling limiter."
          gh release create "$tag" --title "HyprEQ $tag" --notes "$notes" --latest \
            dist/hypreq-*-linux-x86_64.tar.gz \
            dist/hypreq-*-windows-x86_64.zip \
            dist/README-WINDOWS.txt dist/sha256sums.txt
