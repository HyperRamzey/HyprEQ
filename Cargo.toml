[package]
name = "hypreq"
description = "Rig-compensated minimum-phase FIR convolver generator + true-peak ceiling limiter for AutoEq headphone measurements"
version = "1.0.0"
edition = "2021"
rust-version = "1.100"
license = "MIT"

[[bin]]
name = "hypreq"
path = "src/main.rs"

[dependencies]
rustfft = "6.4"
# `preserve_order` keeps `measurements.json` model order (and every object key) as written;
# the default map sorts keys alphabetically, which would reorder `--list-models`, `--headphone
# all` and the default model.
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
plotters = { version = "0.3", default-features = false, features = [
    # PNG output, TrueType text, and the line series (solid, dashed and dotted) the figure
    # draws. Everything else is off: the axes, legend and tick marks are drawn by hand, so
    # the area/point/series features and the palette would only add compile time.
    #
    # `ttf` is a build- and run-time requirement, not a nice-to-have: it pulls font-kit,
    # which links against the system fontconfig and freetype, so those C libraries must be
    # installed to link at all, and fontconfig must be able to resolve "sans-serif" or the
    # figure panics while drawing text. Use `--no-plot` on a machine that has neither.
    "bitmap_backend",
    "bitmap_encoder",
    "ttf",
    "line_series",
] }

[dev-dependencies]
# Only used to read back the rendered verification figure in tests.
png = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Numerical note: the true-peak interpolator, the two-stage gain scheduler and the
# Hilbert-cepstral minimum-phase fold must stay IEEE-754 exact. Rust compiles `+ - *` with
# fp-contract=off by default (no FMA contraction), and that must not change: do NOT add
# `-C target-cpu=native` with fma, `-C llvm-args=--fp-contract=fast`, or any fast-math flag
# here, because a fused multiply-add rounds once instead of twice and the limiter and
# true-peak results would drift off the reference.
#
# Separate from that: the convolver itself is only bit-identical to the reference within a
# couple of ULP, because rustfft and NumPy's pocketfft factor the same transform
# differently and therefore sum the same terms in a different order. That residual is
# transform structure, not instruction selection, and it is what the f32 real-time
# convolvers' parity tolerance (bounded to <= 2 ULP) absorbs.
